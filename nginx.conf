user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Vite emits content-hashed production assets under /assets/. Everything
    # else is revalidated so index, discovery, and map manifests cannot pin an
    # incompatible build. $uri excludes the query string.
    map $uri $cache_control {
        default "no-cache";
        =/index.html "no-store";
        "~^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:css|js|mjs|wasm|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|otf|map)$"
            "public, max-age=31536000, immutable";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $proxy_forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # The selected stock nginx image supports gzip, but has no Brotli module.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/manifest+json application/wasm
               application/xml application/xml+rss image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $cache_control always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # Explicit WASM MIME, even if a downstream image changes mime.types.
        location ~* \.wasm$ {
            default_type application/wasm;
            try_files $uri =404;
        }

        # Missing Vite assets must be 404s, never the SPA document. The cache
        # map grants immutable caching only when the filename contains a hash.
        location /assets/ {
            try_files $uri =404;
        }

        # Map package filenames are stable and compatibility-sensitive. Always
        # revalidate manifests and their referenced GLB/collision payloads.
        location /maps/ {
            try_files $uri =404;
        }

        # Other missing file-like URLs must not fall through to index.html.
        location ~* \.(?:css|js|mjs|map|json|webmanifest|glb|bin|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf)$ {
            try_files $uri =404;
        }

        location = /index.html {
            try_files /index.html =404;
        }

        location /api/ {
            proxy_pass http://web:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # SERVER_WEBSOCKET_URL should advertise
        # wss://<public-origin>/game/. TLS terminates upstream, while this
        # private hop preserves the WebSocket Upgrade to the native server.
        location /game/ {
            proxy_pass http://gameserver:9001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_forwarded_proto;
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Only route extensionless application navigation to the SPA shell.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
