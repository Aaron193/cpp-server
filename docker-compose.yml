# Production-oriented deployment. TLS terminates in front of the client
# container; nginx routes /api/ and /game/ over the private Compose network.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - game-network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-cpp-server-web:local}
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      SERVER_SHARED_SECRET: ${SERVER_SHARED_SECRET:?SERVER_SHARED_SECRET is required}
      JOIN_TICKET_SECRET: ${JOIN_TICKET_SECRET:?JOIN_TICKET_SECRET is required}
      JOIN_TICKET_AUDIENCE: ${JOIN_TICKET_AUDIENCE:-arena-game-server}
      JOIN_TICKET_TTL_SECONDS: ${JOIN_TICKET_TTL_SECONDS:-20}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?CLIENT_ORIGIN is required}
    networks:
      - game-network
    expose:
      - "3000"
    restart: unless-stopped
    command: sh -c "node dist/db/migrate.js && node dist/index.js"

  gameserver:
    image: ${GAME_SERVER_IMAGE:-cpp-server-game:local}
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        VCPKG_COMMIT: ${VCPKG_COMMIT:-9e593bb18ea69cc5095e012465dcd675a822ed0d}
    depends_on:
      web:
        condition: service_healthy
    environment:
      SERVER_ID: ${SERVER_ID:?SERVER_ID is required}
      SERVER_HOST: ${SERVER_HOST:?SERVER_HOST is required for registry metadata}
      SERVER_PORT: "9001"
      SERVER_REGION: ${SERVER_REGION:?SERVER_REGION is required}
      MAX_PLAYERS: ${MAX_PLAYERS:-12}
      SERVER_MODE: ${SERVER_MODE:-ffa}
      SERVER_BUILD_ID: ${SERVER_BUILD_ID:?SERVER_BUILD_ID is required}
      SERVER_PROTOCOL_VERSION: "8"
      SERVER_MAP_ID: ${SERVER_MAP_ID:-graybox-arena}
      SERVER_WEBSOCKET_URL: ${SERVER_WEBSOCKET_URL:?Set the complete externally reachable wss URL}
      GAME_CONFIG_PATH: /app/game_config.json
      MAP_PACKAGE_ROOT: /app/maps
      WEB_API_URL: http://web:3000
      SERVER_SHARED_SECRET: ${SERVER_SHARED_SECRET:?SERVER_SHARED_SECRET is required}
      JOIN_TICKET_SECRET: ${JOIN_TICKET_SECRET:?JOIN_TICKET_SECRET is required}
      JOIN_TICKET_AUDIENCE: ${JOIN_TICKET_AUDIENCE:-arena-game-server}
    networks:
      - game-network
    expose:
      - "9001"
    restart: unless-stopped

  client:
    image: ${CLIENT_IMAGE:-cpp-server-client:local}
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        CLIENT_API_BASE: /api
        CLIENT_BUILD_ID: ${SERVER_BUILD_ID:?SERVER_BUILD_ID is required}
    depends_on:
      web:
        condition: service_healthy
      gameserver:
        condition: service_healthy
    networks:
      - game-network
    ports:
      - "${HTTP_PORT:-8080}:8080"
    restart: unless-stopped

# Networks
networks:
  game-network:
    driver: bridge

# Volumes
volumes:
  postgres_data:
