<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#132023" />
        <meta name="description" content="Iron Front — original browser multiplayer infantry combat. Deploy into Ironworks and fight for the industrial complex." />
        <title>Iron Front — Multiplayer Operations</title>
    </head>
    <body>
        <div id="home-screen" class="home-screen"></div>

        <div id="modal-overlay" class="modal-overlay hidden">
            <div id="modal-container" class="modal-container">
                <button id="modal-close" class="modal-close">&times;</button>
                <div id="modal-content"></div>
            </div>
        </div>

        <div id="game-container" class="game-container hidden">
            <div id="chat_container">
                <input
                    type="text"
                    id="chat_input"
                    class="hidden"
                    placeholder="Type a message..."
                    maxlength="50"
                />
            </div>
            <canvas id="game_canvas"></canvas>
            <div id="game-hud" aria-live="polite"></div>
        </div>

        <script type="module" src="/src/index.ts"></script>
    </body>
</html>
